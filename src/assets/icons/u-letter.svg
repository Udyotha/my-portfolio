<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Letter U Vibrant Gradient -->
    <linearGradient id="uGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#818cf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGlow)"/>

  <!-- Subtle Inner Border Accent -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>

  <!-- Stylized Letter U -->
  <path d="M 160 136 
           C 160 122.7, 170.7 112, 184 112 
           C 197.3 112, 208 122.7, 208 136 
           L 208 272 
           C 208 298.5, 229.5 320, 256 320 
           C 282.5 320, 304 298.5, 304 272 
           L 304 136 
           C 304 122.7, 314.7 112, 328 112 
           C 341.3 112, 352 122.7, 352 136 
           L 352 272 
           C 352 325 309 368, 256 368 
           C 203 368, 160 325, 160 272 
           Z" 
        fill="url(#uGradient)" 
        filter="url(#dropShadow)"/>
</svg>
